<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default "de" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <div class="site-wrapper">
    {{ partial "header.html" . }}

    <main id="main-content" class="main-content">
      {{ block "main" . }}{{ end }}
    </main>

    {{ partial "footer.html" . }}
  </div>

  {{ $script := resources.Get "js/main.js" | resources.Minify | resources.Fingerprint }}
  <script src="{{ $script.RelPermalink }}" integrity="{{ $script.Data.Integrity }}" defer></script>
</body>
</html>
