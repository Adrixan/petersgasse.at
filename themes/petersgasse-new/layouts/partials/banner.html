<div class="page-banner">
  <div class="banner-row__image-col">
    <img class="banner-row__img" src="{{ .image }}" alt="{{ with .alt }}{{ . }}{{ else }}{{ .title }}{{ end }}" width="850" height="178" />
  </div>
  <div class="banner-row__title-col">
    {{ with .pretitle }}<div class="banner-row__pretitle">{{ . }}</div>{{ end }}
    <h1 class="banner-row__title">{{ .title }}</h1>
  </div>
</div>
