{{ define "main" }}
  <div class="post post--erasmus">
    <div class="post__content">
      <h1>{{ .Title }}</h1>
      {{ .Content }}
    </div>
    {{/* section, not div: the theme attaches medium-zoom to "div.post__content img", logos must not zoom */}}
    <section class="post__content">
      {{ partial "erasmus-logos.html" . }}
    </section>
  </div>
{{ end }}
